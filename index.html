<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Menus du mois à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Appli de poche : fond gris vert très clair, cartes blanches, un seul accent vert sauge. Une colonne, barre d'onglets en bas, détails dans des feuilles qui montent du bas. */
  --bg:#f4f6f3; --surface:#ffffff; --surface2:#eef2ee; --ink:#18201b; --muted:#66736b; --faint:#9aa59e; --line:#e3e8e2;
  --accent:#2f7a55; --accent-soft:#e2f0e7; --accent-ink:#ffffff;
  --prot:#c2513a; --carb:#c48a1c; --fat:#7b8f2e; --warn:#b4581f; --danger:#b23a3a;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.05);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#191f1b; --surface2:#212a24; --ink:#e8ede8; --muted:#9daaa1; --faint:#6e7a72; --line:#2a332d;
    --accent:#6cc497; --accent-soft:#1f3328; --accent-ink:#0d1a12;
    --prot:#e98a72; --carb:#e2b55e; --fat:#b9cb63; --warn:#e8a065; --danger:#ef7d7d;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#191f1b; --surface2:#212a24; --ink:#e8ede8; --muted:#9daaa1; --faint:#6e7a72; --line:#2a332d;
  --accent:#6cc497; --accent-soft:#1f3328; --accent-ink:#0d1a12;
  --prot:#e98a72; --carb:#e2b55e; --fat:#b9cb63; --warn:#e8a065; --danger:#ef7d7d;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* Barre du haut */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--accent)} .sync.err i{background:var(--danger)} .sync.wait i{background:var(--carb)}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--faint);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* Blocs */
.sec{margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0}
.sec .aside{font-size:13.5px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--surface2);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.full{width:100%}
.btn svg{width:20px;height:20px}
.btn:disabled{opacity:.45}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.35}

/* Contrôle segmenté */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Bande des jours */
.days{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center;margin:4px 0 14px}
.dpill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;color:var(--muted);position:relative}
.dpill b{font-size:17px;color:var(--ink);font-weight:700}
.dpill span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.dpill.on{background:var(--accent);color:color-mix(in srgb,var(--accent-ink) 80%,transparent)}
.dpill.on b{color:var(--accent-ink)}
.dpill.today::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dpill.on.today::after{background:var(--accent-ink)}
.days .nav{width:28px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.days .nav svg{width:18px;height:18px}
.days .nav:disabled{opacity:.25}

/* Résumé du jour */
.sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.ring .c span{font-size:11px;color:var(--muted);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .lbl b{font-weight:600}
.bar .lbl span{color:var(--muted);font-variant-numeric:tabular-nums}
.bar .tr{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}
.bar.p i{background:var(--prot)} .bar.g i{background:var(--carb)} .bar.l i{background:var(--fat)}

/* Cartes repas */
.meal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 14px 16px}
.meal .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.meal .n{font-weight:700;font-size:16.5px;line-height:1.25;grid-column:1}
.meal .meta{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.meal .r{grid-column:2;grid-row:1/span 3;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.meal .r svg{width:18px;height:18px;color:var(--faint)}
.meal.off{background:transparent;box-shadow:none;border:1.5px dashed var(--line);cursor:default}
.meal.off .n{color:var(--muted);font-weight:600}

/* Listes groupées façon réglages */
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 16px;width:100%;text-align:left;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.li .v{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.li .chev{width:18px;height:18px;color:var(--faint);flex:none}
.li input[type=date],.li select{border:0;background:var(--surface2);border-radius:10px;padding:7px 10px;font-size:16px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.ck svg{width:16px;height:16px;color:var(--accent-ink);opacity:0}
.li.done .ck{background:var(--accent);border-color:var(--accent)}
.li.done .ck svg{opacity:1}
.li.done .t b,.li.done .v{color:var(--faint);text-decoration:line-through}

/* Interrupteur */
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(20px)}

/* Jours de la semaine */
.wday{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.wday .d{display:flex;flex-direction:column;align-items:center;border-radius:12px;background:var(--surface2);padding:6px 0}
.wday .d span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.wday .d b{font-family:var(--display);font-size:20px;line-height:1.1}
.wday.today .d{background:var(--accent);color:var(--accent-ink)} .wday.today .d span{color:inherit}
.wday .m{min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.wday .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wday .m em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.wday .chev{width:18px;height:18px;color:var(--faint)}

/* Gros chiffre */
.big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:5px}

/* Barre d'action collante */
.dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:25;padding:10px 16px;pointer-events:none}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:8px;pointer-events:auto}
.dock .btn{box-shadow:0 6px 20px rgba(20,40,28,.18)}
.app.withdock{padding-bottom:calc(160px + env(safe-area-inset-bottom))}

/* Feuille du bas */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(10,16,12,.42)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet .pn{animation:none}.sw,.sw::after{transition:none}}
.pn .hd{padding:8px 20px 10px;display:flex;align-items:flex-start;gap:12px}
.pn .hd .grab{position:absolute;top:7px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.pn .hd .tt{flex:1;padding-top:14px}
.pn .hd .tt small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pn .hd h2{font-family:var(--display);font-size:23px;line-height:1.15;margin:3px 0 0;text-wrap:balance}
.pn .hd .x{margin-top:12px}
.pn .bdy{overflow:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.pn .bdy>*+*{margin-top:14px}
.ing .li{min-height:46px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15.5px;line-height:1.45}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.note{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14.5px}
.note.warn{background:color-mix(in srgb,var(--warn) 13%,transparent)}
.macro{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.macro b{color:var(--ink);font-variant-numeric:tabular-nums}
.macro .p b{color:var(--prot)} .macro .g b{color:var(--carb)} .macro .l b{color:var(--fat)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:84px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:16px;text-align:right}
.qty span{width:44px;font-size:13px;color:var(--muted)}
.dw{display:flex;gap:6px}
.dw button{flex:1;height:42px;border-radius:12px;background:var(--surface2);font-weight:700;color:var(--muted)}
.dw button.on{background:var(--accent);color:var(--accent-ink)}
.code{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.06em;word-break:break-all;text-align:center;padding:14px;background:var(--surface2);border-radius:14px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.chart svg{display:block;width:100%;height:auto}
.wadd{display:flex;gap:8px}
.wadd input{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
textarea.clip{position:absolute;left:-9999px}
@media (min-width:600px){.top h1{font-size:32px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabbar" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<textarea class="clip" id="clip" aria-hidden="true" tabindex="-1"></textarea>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

 beurre:{n:"Beurre",p:0.7,l:82,g:0.7,r:"Crèmerie et œufs",max:25},

 const sport=p.act>0&&(p.train||[]).some(Boolean);
 let P=Math.round(wRef*(sport?g[2]:Math.min(g[2],1.6))*fP);
 let L=Math.min(Math.max(Math.round(wRef*(p.sex==="H"?0.9:1.0)),Math.round(kcal*0.22/9)),Math.round(kcal*0.35/9));
 let G=Math.round((kcal-4*P-9*L)/4);

const TABS=[["jour","Aujourd'hui"],["semaine","Semaine"],["courses","Courses"],["stock","Stock"],["moi","Réglages"]];

/* ---------- Écran Aujourd'hui ---------- */
function seg(opts,val,act){return `<div class="seg" role="tablist">${opts.map(([v,l])=>`<button role="tab" aria-selected="${String(v)===String(val)}" class="${String(v)===String(val)?"on":""}" data-a="${act}" data-v="${v}">${l}</button>`).join("")}</div>`}
function personSeg(withAll){const o=S.people.map((p,i)=>[i,first(p)]);if(withAll)o.push(["all","Les deux"]);return seg(o,S.me,"me")}
function ring(val,target){
 const r=42,c=2*Math.PI*r,pct=Math.max(0,Math.min(1,val/target));
 return `<div class="ring"><svg viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*pct).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="c"><b>${fr(val)}</b><span>sur ${fr(target)} kcal</span></div></div>`;
}
const bar=(cls,lab,v,t)=>`<div class="bar ${cls}"><div class="lbl"><b>${lab}</b><span>${Math.round(v)} / ${t} g</span></div><div class="tr"><i style="width:${Math.min(100,Math.round(v/t*100))}%"></i></div></div>`;
function summaryCard(i){
 if(S.me==="all"){
  return `<div class="card stack">${S.people.map((p,pi)=>{const d=pd(pi,i);const m=macrosOf(sumItems([d.bkf,d.lunch,d.snack,d.dinner]));return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${esc(p.name)}</b><div class="chips" style="margin-top:4px">${p.train.some(Boolean)?`<span class="chip${d.tr?" acc":""}">${d.tr?"Jour de salle":"Repos"}</span>`:""}${d.out?`<span class="chip">Midi en entreprise</span>`:""}</div></div><div class="num" style="text-align:right"><b>${fr(m.kcal)}</b> <span class="muted small">/ ${fr(d.target.kcal)} kcal</span></div></div>`}).join(`<div style="border-top:1px solid var(--line)"></div>`)}<p class="muted small" style="margin:0">Les fiches des repas donnent les quantités à cuisiner pour vous deux.</p></div>`;
 }
 const d=pd(S.me,i),t=d.target,m=macrosOf(sumItems([d.bkf,d.lunch,d.snack,d.dinner]));
 return `<div class="card stack"><div class="sum">${ring(m.kcal,t.kcal)}<div class="bars">${bar("p","Protéines",m.p,t.P)}${bar("g","Glucides",m.g,t.G)}${bar("l","Lipides",m.l,t.L)}</div></div><div class="chips">${S.people[S.me].train.some(Boolean)?`<span class="chip${d.tr?" acc":""}">${d.tr?"Jour de salle":"Jour de repos"}</span>`:""}${d.out?`<span class="chip">Midi en entreprise, non compté ici</span>`:""}${S.people[S.me].adj?`<span class="chip">Calories ajustées de ${S.people[S.me].adj>0?"+":""}${S.people[S.me].adj}</span>`:""}</div>${gapNote(S.people[S.me],m.kcal,t.kcal)}</div>`;
}
/* si les plats du jour ne suffisent pas à atteindre l'objectif, on le dit et on propose quoi ajouter */
function gapNote(p,k,t){const gap=t-k;
 if(gap>t*0.07)return `<div class="note small" style="margin:0">Il manque environ ${fr(Math.round(gap/10)*10)} kcal aujourd'hui. Ajoute un fruit, une poignée d'amandes ou une tranche de pain à un repas.</div>`;
 if(-gap>t*0.07)return `<div class="note small" style="margin:0">Journée un peu au-dessus de ton objectif, d'environ ${fr(Math.round(-gap/10)*10)} kcal. Rien de grave sur une journée.</div>`;
 return ""}
function mealMeta(day,i,k,rec){
 const out=[];
 if(mins(rec))out.push(`<span class="chip">${mins(rec)} min</span>`);
 if(quick(rec))out.push(`<span class="chip acc">Rapide</span>`);
 if(k==="lunch"&&day.left)out.push(`<span class="chip acc">Restes d'hier soir</span>`);
 const nx=PLAN[i+1];if(k==="dinner"&&nx&&nx.left&&nx.lunch===rec)out.push(`<span class="chip acc">+ boîtes pour demain midi</span>`);
 if(day.ov[k])out.push(`<span class="chip">Changé</span>`);
 return out.join("");
}
/* les menus durent un temps limité : on propose la suite pendant la dernière semaine, et après la fin */
function planEnd(){return addDays(S.start,S.days-1)}
function nextBanner(){
 const t=todayIso(),end=planEnd();if(t<addDays(end,-6))return "";
 const fin=new Date(end+"T12:00:00");
 const msg=t>end?`Les menus se sont terminés le ${fmtLong(fin)}.`:`Les menus se terminent ${t===end?"aujourd'hui":"le "+fmtLong(fin)}.`;
 return `<div class="card stack" style="margin-bottom:14px"><b>${msg}</b><p class="muted small" style="margin:0">Le stock et les courses validées sont gardés.</p><button class="btn pri full" data-a="nextplan">Préparer les ${S.days===28?"4 semaines":S.days+" jours"} suivant${S.days===28?"e":""}s</button></div>`;
}
function viewJour(){
 const i=S.day,day=PLAN[i],wk=Math.floor(i/7),ti=todayIdx();
 let strip=`<div class="days"><button class="nav" data-a="dayweek" data-v="-1" aria-label="Semaine précédente" ${wk===0?"disabled":""}>${ic("left")}</button>`;
 for(let j=wk*7;j<wk*7+7;j++){const d=PLAN[j];if(!d){strip+=`<span></span>`;continue}strip+=`<button class="dpill${j===i?" on":""}${j===ti?" today":""}" data-a="day" data-v="${j}" aria-label="${fmtLong(d.date)}"><span>${WD[dow(d.date)]}</span><b>${d.date.getDate()}</b></button>`}
 strip+=`<button class="nav" data-a="dayweek" data-v="1" aria-label="Semaine suivante" ${wk>=nWeeks()-1?"disabled":""}>${ic("right")}</button></div>`;
 const keys=MK.filter(([k])=>k!=="snack"||(S.me==="all"?S.people.some(p=>p.snack):S.people[S.me].snack));
 let cards="";
 keys.forEach(([k,lab])=>{
  if(S.me==="all"){
   const groups=[];S.people.forEach((p,pi)=>{const d=pd(pi,i);if(!d[k])return;const r=d.recs[k]||day[k];let g=groups.find(x=>x.r===r);if(!g){g={r,who:[],kcal:0};groups.push(g)}g.who.push(pi);g.kcal+=macrosOf(d[k]).kcal});
   if(!groups.length){cards+=`<div class="meal off"><div class="k">${lab}</div><div class="n">Personne ne mange à la maison</div></div>`;return}
   groups.forEach(g=>{cards+=`<button class="meal" data-a="meal" data-v="${i}|${k}|${esc(g.r.n)}"><div class="k">${lab}${groups.length>1?` · ${g.who.map(x=>first(S.people[x])).join(", ")}`:""}</div><div class="n">${esc(g.r.n)}</div><div class="meta">${mealMeta(day,i,k,g.r)}</div><div class="r">${fr(g.kcal)} kcal${ic("right")}</div></button>`});
  }else{
   const d=pd(S.me,i);
   if(k==="lunch"&&d.out){cards+=`<div class="meal off"><div class="k">${lab}</div><div class="n">Midi en entreprise</div></div>`;return}
   if(!d[k])return;
   const r=d.recs[k]||day[k];
   cards+=`<button class="meal" data-a="meal" data-v="${i}|${k}|${esc(r.n)}"><div class="k">${lab}</div><div class="n">${esc(r.n)}</div><div class="meta">${mealMeta(day,i,k,r)}</div><div class="r">${fr(macrosOf(d[k]).kcal)} kcal${ic("right")}</div></button>`;
  }
 });
 return `${nextBanner()}${strip}${personSeg(true)}<div style="height:12px"></div>${summaryCard(i)}<div class="sec"><h2>Repas</h2><span class="aside">poids crus</span></div><div class="stack">${cards}</div>`;
}

/* ---------- Feuille d'un repas ---------- */
function sheetMeal(o){
 const i=o.i,k=o.k,day=PLAN[i];if(!day)return null;
 const rec=byName(o.n)||day[k];
 const who=S.people.map((p,pi)=>pi).filter(pi=>{const d=pd(pi,i);return d[k]&&(d.recs[k]||day[k])===rec});
 if(!who.length)return null;
 let sel=o.sel!=null?o.sel:(S.me==="all"?"all":(who.includes(S.me)?S.me:who[0]));
 if(sel!=="all"&&!who.includes(+sel))sel=who[0];
 if(sel==="all"&&who.length<2)sel=who[0];
 const nx=PLAN[i+1],boxes=k==="dinner"&&nx&&nx.left&&nx.lunch===rec;
 const rank=x=>x===rec.prot?0:x===rec.carb?1:x===rec.fat?3:2;
 const side=x=>x==="painc"&&rec.carb!=="painc"&&(k==="lunch"||k==="dinner");
 const ingList=items=>`<div class="list ing">${Object.keys(items).sort((a,b)=>rank(a)-rank(b)).map(x=>`<div class="li"><div class="t"><b>${esc(F[x].n)}</b>${side(x)?"<small>en accompagnement</small>":""}</div><div class="v">${qty(x,items[x])}</div></div>`).join("")}</div>`;
 let body="";
 if(who.length>1){const opts=who.map(pi=>[pi,first(S.people[pi])]);opts.push(["all","Les deux"]);body+=seg(opts,sel,"msel")}
 if(sel==="all"){
  const items=sumItems(who.map(pi=>pd(pi,i)[k]));
  body+=`<div><div class="sec" style="margin-top:4px"><h2>Pour vous deux</h2></div>${ingList(items)}</div>`;
  if(boxes){const nd=who.map(pi=>pd(pi,i+1).lunch).filter(Boolean);if(nd.length){body+=`<div><div class="sec"><h2>À cuisiner ce soir</h2><span class="aside">${nd.length} ${nd.length>1?"boîtes":"boîte"} comprises</span></div>${ingList(sumItems(who.map(pi=>pd(pi,i)[k]).concat(nd)))}</div>`}}
 }else{
  const items=pd(+sel,i)[k],m=macrosOf(items);
  body+=`<div class="macro"><span><b>${fr(m.kcal)}</b> kcal</span><span class="p"><b>${Math.round(m.p)} g</b> prot.</span><span class="g"><b>${Math.round(m.g)} g</b> gluc.</span><span class="l"><b>${Math.round(m.l)} g</b> lip.</span></div>${ingList(items)}`;
  if(boxes)body+=`<div class="note">Ce soir, cuisine aussi pour la boîte de demain midi. Les quantités totales sont dans « Les deux »${who.length<2?" ou dans la fiche de demain":""}.</div>`;
 }
 if(k==="lunch"&&day.left)body+=`<div class="note">Ce sont les restes du dîner d'hier soir. Rien à cuisiner, juste à réchauffer.</div>`;
 if(rec.st&&rec.st.length){const t=rec.t||[0,0];body+=`<div><div class="sec"><h2>Recette</h2><span class="aside">${t[0]} min de préparation${t[1]?` · ${t[1]} min de cuisson`:""}</span></div><ol class="steps">${rec.st.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></div>`}
 if(k==="bkf"&&who.every(pi=>S.people[pi].bkfFixed===rec.n)){body+=`<div class="note" style="margin-top:18px">Petit déjeuner fixe : il revient tous les jours. Pour le changer, va dans Réglages puis le profil.</div>`;return {kicker:`${MLAB[k]} · ${fmtLong(day.date)}`,title:rec.n,body}}
 body+=`<div class="stack" style="margin-top:22px"><button class="btn pri full" data-a="swap" data-v="${i}|${k}">${ic("swap")}Changer de plat</button><div class="grid2"><button class="btn line" data-a="ban" data-v="${i}|${k}">Je n'aime pas</button>${day.ov[k]?`<button class="btn line" data-a="reset" data-v="${i}|${k}">${ic("undo")}Plat prévu</button>`:`<button class="btn line" data-a="close">Fermer</button>`}</div><p class="muted tiny" style="margin:0;text-align:center">« Je n'aime pas » retire ce plat de tous les menus. Tu peux le remettre dans Réglages.</p></div>`;
 return {kicker:`${MLAB[k]} · ${fmtLong(day.date)}`,title:rec.n,body};
}

/* ---------- Écran Semaine ---------- */
function weekNav(cur,act){
 const a=PLAN[cur*7].date,b=PLAN[Math.min(S.days-1,cur*7+6)].date;
 return `<div style="display:flex;align-items:center;gap:10px;margin:2px 0 14px"><button class="icon-btn" data-a="${act}" data-v="-1" aria-label="Semaine précédente" ${cur===0?"disabled":""}>${ic("left")}</button><div style="flex:1;text-align:center"><b>Semaine ${cur+1}</b> <span class="muted">sur ${nWeeks()}</span><div class="muted small">${fmtShort(a)} au ${fmtShort(b)}</div></div><button class="icon-btn" data-a="${act}" data-v="1" aria-label="Semaine suivante" ${cur>=nWeeks()-1?"disabled":""}>${ic("right")}</button></div>`;
}
function viewSemaine(){
 const w=S.week,ti=todayIdx();let rows="";
 for(let i=w*7;i<Math.min(S.days,w*7+7);i++){
  const d=PLAN[i];
  const train=S.people.filter(p=>p.train[dow(d.date)]).map(first);
  const out=S.people.filter(p=>eatsOut(p,d.date)).map(first);
  rows+=`<button class="wday${i===ti?" today":""}" data-a="goday" data-v="${i}"><div class="d"><span>${WD[dow(d.date)]}</span><b>${d.date.getDate()}</b></div><div class="m"><div><em>Midi</em>${esc(d.lunch.n)}${d.left?` <span class="muted">(restes)</span>`:""}</div><div><em>Soir</em>${esc(d.dinner.n)}</div>${train.length||out.length?`<div class="chips" style="margin-top:3px">${train.length?`<span class="chip acc">Salle : ${train.join(", ")}</span>`:""}${out.length?`<span class="chip">En entreprise : ${out.join(", ")}</span>`:""}</div>`:""}</div>${ic("right").replace("<svg",'<svg class="chev"')}</button>`;
 }
 return `${nextBanner()}${weekNav(w,"week")}<div class="stack">${rows}</div>
 <div class="sec"><h2>Options des menus</h2></div>
 <div class="list"><button class="li" data-a="leftovers"><div class="t"><b>Restes du dîner le midi</b><small>En semaine, le dîner est cuisiné en double pour le lendemain midi</small></div>${sw(S.leftovers)}</button><button class="li" data-a="sheet" data-v="regen"><div class="t"><b>Générer de nouveaux menus</b><small>Remplace tous les plats du mois</small></div>${ic("right").replace("<svg",'<svg class="chev"')}</button></div>
 ${PLANWARN?`<div class="note warn" style="margin-top:12px">${PLANWARN}</div>`:""}`;
}

/* ---------- Écran Courses ---------- */
function viewCourses(){
 stockOf();const w=S.week,open=firstOpenWeek();
 if(isDone(w)){
  const L=S.ledger[wkKey(w)]||{},items=Object.keys(L.bought||{}).filter(k=>L.bought[k]>0);
  return `${weekNav(w,"week")}<div class="card stack"><div style="display:flex;align-items:center;gap:10px"><span class="ck" style="background:var(--accent);border-color:var(--accent)">${ic("check").replace("<svg",'<svg style="opacity:1"')}</span><b>Courses faites pour cette semaine</b></div><p class="muted small" style="margin:0">Les achats ont été ajoutés au stock, et ce que vous mangez cette semaine en a été retiré.</p></div>
  ${items.length?`<div class="sec"><h2>Acheté</h2></div><div class="list">${items.map(k=>`<div class="li"><div class="t"><b>${esc(F[k].n)}</b></div><div class="v">${stockQty(k,L.bought[k])}</div></div>`).join("")}</div>`:""}
  ${w===lastDone()?`<div style="margin-top:16px"><button class="btn line full" data-a="undo">${ic("undo")}Annuler la validation</button></div>`:""}`;
 }
 const {tot,buy,have,groups}=toBuy(w),ck=S.checked[wkKey(w)]||{};
 let total=0;for(const k in buy)total+=price(k,buy[k]);
 const n=Object.keys(buy).length,nck=Object.keys(buy).filter(k=>ck[k]).length,inStock=Object.keys(tot).filter(k=>!buy[k]);
 let html=`${weekNav(w,"week")}<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><div class="muted small">Budget estimé</div><div class="big">≈ ${fr(total)} €</div></div><div class="num" style="text-align:right"><b>${nck} / ${n}</b><div class="muted small">dans le panier</div></div></div><div class="prog"><i style="width:${n?Math.round(nck/n*100):0}%"></i></div></div>
 <div class="list" style="margin-top:10px"><button class="li" data-a="cheap"><div class="t"><b>Prix bas</b><small>Viande surgelée et gros paquets</small></div>${sw(S.cheap)}</button></div>`;
 if(w>open)html+=`<div class="note warn" style="margin-top:12px">Valide d'abord les courses de la semaine ${open+1} pour que le stock soit juste.</div>`;
 if(isPast(w))html+=`<div class="note" style="margin-top:12px">Cette semaine est passée. La liste reste visible, mais il n'y a plus rien à valider.</div>`;
 if(!n)html+=`<div class="empty"><b>Rien à acheter</b>Tout est déjà dans le stock cette semaine.</div>`;
 AISLES.forEach(a=>{const ks=(groups[a]||[]).filter(k=>buy[k]).sort((x,y)=>F[x].n.localeCompare(F[y].n));if(!ks.length)return;
  html+=`<div class="sec"><h2>${a}</h2><span class="aside">${ks.length}</span></div><div class="list">${ks.map(k=>`<button class="li${ck[k]?" done":""}" data-a="ck" data-v="${k}" role="checkbox" aria-checked="${!!ck[k]}"><span class="ck">${ic("check")}</span><div class="t"><b>${esc(F[k].n)}</b><small>${have[k]>0.5?`${stockQty(k,have[k])} déjà en stock · `:""}≈ ${euro(price(k,buy[k]))}</small></div><div class="v">${shopQty(k,buy[k])}</div></button>`).join("")}</div>`});
 if(inStock.length)html+=`<div class="sec"><h2>Déjà dans le stock</h2><span class="aside">${inStock.length}</span></div><div class="list">${inStock.map(k=>`<div class="li"><div class="t"><b class="muted">${esc(F[k].n)}</b></div><div class="v">${shopQty(k,tot[k])}</div></div>`).join("")}</div>`;
 html+=`<p class="muted tiny" style="margin-top:16px">Pour vous deux, stock déduit. Épices, sel, ail, citron, moutarde, vinaigre et bouillon non comptés. Prix moyens en marque distributeur.</p>`;
 return html;
}
function dockCourses(){
 const w=S.week;if(isDone(w))return "";
 const open=firstOpenWeek();
 return `<div class="dock"><div class="in">${w===open?`<button class="btn pri" style="flex:1" data-a="sheet" data-v="buy">${ic("check")}J'ai fait les courses</button>`:`<span style="flex:1"></span>`}<button class="btn" style="background:var(--surface)" data-a="copy" aria-label="Copier la liste">${ic("copy")}Copier</button></div></div>`;
}
function sheetBuy(){
 const w=S.week,{tot,buy,have}=toBuy(w);
 const keys=Object.keys(tot).sort((a,b)=>F[a].n.localeCompare(F[b].n));
 return {kicker:`Semaine ${w+1}`,title:"Ce que tu as acheté",body:`<p class="muted small" style="margin:0">Corrige avec les quantités vraiment prises, paquets entiers compris. Le surplus part dans le stock.</p><div class="list">${keys.map(k=>`<div class="li"><div class="t"><b>${esc(F[k].n)}</b><small>besoin ${shopQty(k,tot[k])}${have[k]>0.5?` · en stock ${stockQty(k,have[k])}`:""}</small></div><label class="qty"><input data-bq="${k}" type="number" inputmode="decimal" min="0" step="any" value="${toInput(k,buy[k]||0)}" aria-label="${esc(F[k].n)}"><span>${unitLbl(k)}</span></label></div>`).join("")}</div><button class="btn pri full" data-a="validate">Valider et mettre à jour le stock</button>`};
}

/* ---------- Écran Stock ---------- */
function viewStock(){
 const st=stockOf(),keys=Object.keys(st).filter(k=>st[k]>0.5);
 let html=`<div style="display:flex;gap:10px;margin:4px 0 6px"><button class="btn pri" style="flex:1" data-a="sheet" data-v="addstock">${ic("plus")}Ajouter au stock</button></div>`;
 if(!keys.length)html+=`<div class="empty"><b>Le stock est vide</b>Après tes premières courses validées, ce qui reste à la maison apparaîtra ici. Tu peux aussi ajouter ce que tu as déjà dans tes placards.</div>`;
 const groups={};keys.forEach(k=>{(groups[F[k].r]=groups[F[k].r]||[]).push(k)});
 AISLES.forEach(a=>{const ks=(groups[a]||[]).sort((x,y)=>F[x].n.localeCompare(F[y].n));if(!ks.length)return;
  html+=`<div class="sec"><h2>${a}</h2></div><div class="list">${ks.map(k=>`<button class="li" data-a="sheet" data-v="stk:${k}"><div class="t"><b>${esc(F[k].n)}</b></div><div class="v">${stockQty(k,st[k])}</div>${ic("right").replace("<svg",'<svg class="chev"')}</button>`).join("")}</div>`});
 html+=`<div class="note" style="margin-top:18px">Le stock est déduit automatiquement des listes de courses. Viande en trop : congèle-la le jour des courses.</div>`;
 if(keys.length)html+=`<div style="margin-top:12px"><button class="btn line danger full" data-a="sheet" data-v="clearstock">Vider le stock</button></div>`;

function sheetStock(k){
 const st=stockOf();const f=F[k];const v=st[k]||0;
 return {kicker:"Stock",title:f.n,body:`<label class="field">Quantité à la maison<span class="qty" style="gap:10px"><input id="stkv" type="number" inputmode="decimal" min="0" step="any" style="flex:1;width:auto" value="${f.pc?Math.round(v/f.pc*10)/10:Math.round(v)}"><span>${unitLbl(k)}</span></span></label><button class="btn pri full" data-a="stksave" data-v="${k}">Enregistrer</button><button class="btn line danger full" data-a="stkdel" data-v="${k}">Retirer du stock</button>`};
}
function sheetAddStock(){
 const opts=Object.keys(F).sort((a,b)=>F[a].n.localeCompare(F[b].n)).map(k=>`<option value="${k}">${esc(F[k].n)}</option>`).join("");
 return {kicker:"Stock",title:"Ajouter au stock",body:`<label class="field">Aliment<select id="addk">${opts}</select></label><label class="field">Quantité<input id="addq" type="number" inputmode="decimal" min="0" step="any" placeholder="Par exemple 500"></label><p class="muted small" style="margin:0">En grammes, en millilitres pour le lait, et en nombre pour les œufs, bananes, pommes, tortillas et pains burger.</p><button class="btn pri full" data-a="addstock">Ajouter</button>`};
}

/* ---------- Écran Réglages ---------- */
function spark(log,p){
 const pts=log.slice(-60);if(pts.length<2)return"";
 const W=320,H=120,px=6,py=12;const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime();
 const v=pts.map(e=>e.kg);let lo=Math.min(...v),hi=Math.max(...v);if(hi-lo<1){const m=(hi+lo)/2;lo=m-0.5;hi=m+0.5}
 const X=d=>px+(new Date(d).getTime()-t0)/Math.max(1,t1-t0)*(W-2*px),Y=k=>H-py-(k-lo)/(hi-lo)*(H-2*py);
 const avg=pts.map(e=>{const a=avgBetween(pts,addDays(e.d,-6),e.d);return [X(e.d),Y(a.avg)]});
 const last=avg[avg.length-1];
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Courbe du poids"><line x1="${px}" x2="${W-px}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/><line x1="${px}" x2="${W-px}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/><path d="M${avg.map(a=>a.join(" ")).join(" L")} L${last[0]} ${H-py} L${avg[0][0]} ${H-py} Z" fill="var(--accent)" opacity=".1"/>${pts.map(e=>`<circle cx="${X(e.d)}" cy="${Y(e.kg)}" r="2.6" fill="var(--faint)"/>`).join("")}<polyline fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="${avg.map(a=>a.join(",")).join(" ")}"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${px}" y="${Y(hi)-3}" font-size="11" fill="var(--muted)">${fr(hi,1)} kg</text><text x="${px}" y="${H+12}" font-size="11" fill="var(--muted)">${fr(lo,1)} kg</text></svg></div>`;
}

function goalLine(p,tr){
 const lo=p.goalMin>0?p.goalMin:null,hi=p.goalMax>0?p.goalMax:null;if(!lo&&!hi)return "";
 const cur=tr&&tr.avg?tr.avg:p.w,range=lo&&hi?`entre ${fr(lo,lo%1?1:0)} et ${fr(hi,hi%1?1:0)} kg`:lo?`au moins ${fr(lo,lo%1?1:0)} kg`:`au plus ${fr(hi,hi%1?1:0)} kg`;
 let txt=`Objectif : ${range}. `;
 if(hi&&cur>hi){const left=cur-hi;txt+=`Encore ${fr(left,1)} kg pour y entrer.`;if(tr&&tr.rate!=null&&tr.rate<-0.05)txt+=` À ce rythme, environ ${Math.ceil(left/-tr.rate)} semaines.`;if(p.goal!=="perte")txt+=` Pour y aller, choisis l'objectif Perte de gras dans ton profil.`}
 else if(lo&&cur<lo){txt+=`Tu es ${fr(lo-cur,1)} kg en dessous.`;if(p.goal==="perte")txt+=` Passe en Maintien dans ton profil.`}
 else{txt+=`Tu es dans ta fourchette.`;if(p.goal==="perte")txt+=` Tu peux passer en Maintien dans ton profil, ou continuer vers le bas de la fourchette.`}
 return `<div class="note small" style="margin:0">${txt}</div>`;
}

  case "nextplan":{S.start=addDays(S.start,S.days);S.seed=Math.floor(Math.random()*1e9);S.ov={};S._seen={};lastPushed="";DCACHE.clear();buildPlan();const t=todayIdx();S.day=t>=0?t:0;S.week=Math.floor(S.day/7);refresh();window.scrollTo(0,0);break}
  case "ck":{const w=wkKey(S.week);S.checked[w]=S.checked[w]||{};const nv=!S.checked[w][v];S.checked[w][v]=nv;saveLocal();pushChecked(w,v,nv);render();break}
  case "copy":{const {buy,groups}=toBuy(S.week);const txt="Courses semaine "+(S.week+1)+"\n\n"+AISLES.map(o=>{const ks=(groups[o]||[]).filter(k=>buy[k]);return ks.length?o+"\n"+ks.map(k=>"  "+F[k].n+" : "+shopQty(k,buy[k])).join("\n"):""}).filter(Boolean).join("\n\n");copyText(txt,b,"Copiée");break}
  case "validate":{
   const w=S.week,st=stockOf(),{tot}=shoppingFor(w),bought={};
   document.querySelectorAll("[data-bq]").forEach(x=>{bought[x.dataset.bq]=fromInput(x.dataset.bq,x.value)});
   S.ledger[wkKey(w)]={before:Object.assign({},st),bought};
   new Set([...Object.keys(st),...Object.keys(tot),...Object.keys(bought)]).forEach(k=>{const q=Math.max(0,(st[k]||0)+(bought[k]||0)-(tot[k]||0));if(q>0.5)st[k]=q;else delete st[k]});
   S.done[wkKey(w)]=true;S.checked[wkKey(w)]={};lastPushed="";S.sheet=null;refresh();window.scrollTo(0,0);break}
  case "undo":{const key=wkKey(S.week);if(S.ledger[key]){S.stock=S.ledger[key].before;delete S.ledger[key]}delete S.done[key];refresh();break}
  case "stksave":{const q=fromInput(v,$("#stkv").value),st=stockOf();if(q>0.5)st[v]=q;else delete st[v];S.sheet=null;refresh();break}
  case "stkdel":{delete stockOf()[v];S.sheet=null;refresh();break}
  case "addstock":{const k=$("#addk").value,q=fromInput(k,$("#addq").value);if(q>0){const st=stockOf();st[k]=(st[k]||0)+q}S.sheet=null;refresh();break}
  case "clearstock":S.stock={};S.sheet=null;refresh();break;
  case "addw":{const val=parseFloat(String($("#wkg").value).replace(",","."));if(val>=35&&val<=250){addWeight(+v,val,todayIso());refresh()}else{$("#wkg").focus()}break}
  case "delw":{const [pi,d]=v.split(":");const p=S.people[+pi];p.log=(p.log||[]).filter(x=>x.d!==d);refresh();break}
  case "resetadj":{const p=S.people[+v];p.adj=0;p.adjMsg="";p.adjAt=todayIso();refresh();break}
  case "tr":{const [pi,d]=v.split(":").map(Number);S.people[pi].train[d]=!S.people[pi].train[d];refresh();break}
  case "snack":S.people[+v].snack=!S.people[+v].snack;refresh();break;
  case "sweet":S.people[+v].sweet=!S.people[+v].sweet;refresh();break;
  case "ex":S.excl=S.excl.includes(v)?S.excl.filter(x=>x!==v):S.excl.concat(v);refresh(true);break;
  case "unban":S.banned=(S.banned||[]).filter(n=>n!==v);resolvePlan();refresh();break;
  case "create":createFoyer();break;
  case "join":joinFoyer($("#joincode").value);break;
  case "leave":leaveFoyer();break;
  case "owner":S.owner=+v;S.me=+v;S.sheet=null;saveLocal();render();break;
  case "copycode":copyText(fmtCode(S.household),b,"Code copié");break;
 }
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.p!==undefined){const p=S.people[+t.dataset.p],f=t.dataset.f;let v=t.value;
  if(["goalMin","goalMax"].includes(f)){v=String(v).trim()===""?null:parseFloat(String(v).replace(",","."));if(v!=null&&(isNaN(v)||v<30||v>250))return}
  else if(["age","h","w","act","kadj"].includes(f)){v=parseFloat(String(v).replace(",","."));if(isNaN(v))return}
  if(f==="name"&&!v.trim())v="Personne "+(+t.dataset.p+1);
  p[f]=v;refresh();return}
 if(t.dataset.g){if(t.dataset.g==="start"){if(!t.value)return;S.start=t.value}else S.days=+t.value;S.week=0;S.day=0;refresh(true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet)closeSheet();if(e.key==="Enter"&&e.target.id==="wkg"){const b=document.querySelector('[data-a="addw"]');if(b)b.click()}});

const APPV="2026-11-18f";
/* ---------- Démarrage ---------- */
if(S.tab==="menus")S.tab="jour";else if(S.tab==="profils")S.tab="moi";
function renamePrincess(){let ch=false;const p=S.people[1];if(p&&(p.name==="Ma conjointe"||p.name==="Personne 2")){p.name="Princesse";ch=true}
 /* version 3 : pas de collation, petit déjeuner fixe pour Princesse */
 if((S.v||0)<3){S.people.forEach(q=>{q.snack=false});if(S.people[1]&&!S.people[1].bkfFixed)S.people[1].bkfFixed="Flocons d'avoine, muesli chocolat et lait";S.v=3;ch=true}
 /* version 4 : Princesse pèse 66 kg et vise 50 à 60 kg, menus sur 4 semaines pleines, semaines repérées par leur date */
 if((S.v||0)<4){
  if(p){if(p.w===60)p.w=66;if(p.goal==="recompo")p.goal="perte";if(p.goalMin==null&&p.goalMax==null){p.goalMin=50;p.goalMax=60}}
  if(S.days===30)S.days=28;
  const conv=o=>{if(!o)return o;const n={};for(const k in o){const m=/^w?(\d{1,2})$/.exec(k);n[m?wkKey(+m[1]):k]=o[k]}return n};
  S.done=conv(S.done);S.ledger=conv(S.ledger);S.checked=conv(S.checked);
  S.v=4;ch=true}
 /* version 5 : Princesse mesure 1m60 et ne fait pas de sport */
 if((S.v||0)<5){
  if(p){if(p.h===165)p.h=160;if(p.act===1)p.act=0;if(JSON.stringify(p.train)===JSON.stringify([false,true,false,false,true,false,false]))p.train=[false,false,false,false,false,false,false]}
  S.v=5;ch=true}
 /* version 6 : Anthony trouve les portions trop copieuses, 300 kcal de moins par jour (réglable dans son profil) */
 if((S.v||0)<6){
  S.people.forEach(q=>{if(q.kadj===undefined)q.kadj=0});
  const a=S.people.find(q=>/anthony/i.test(q.name||""));if(a&&!a.kadj)a.kadj=-300;
  S.v=6;ch=true}
 S.people.forEach(q=>{if(q.bkfFixed===undefined)q.bkfFixed=""});
 return ch}
renamePrincess();
S.sheet=null;
if(S.owner!=null&&S.people[S.owner])S.me=S.owner;
buildPlan();
{const t=todayIdx();if(t>=0)S.day=t;else if(S.day==null)S.day=0;S.week=Math.floor((S.day|0)/7)}
render();
if(S.owner==null)openSheet({t:"who"});
if(S.household)subscribe();
