<style>
:root{
  /* Carnet de cuisine : fond vert très pâle, accent vert herbe, trois couleurs de macros. Une colonne sur mobile. */
  --bg:#f3f5f1; --surface:#ffffff; --ink:#1c231f; --muted:#5d6a62; --line:#dde4da; --accent:#2e6a4e; --accent-ink:#ffffff; --soft:#e7efe9;
  --prot:#b4452f; --carb:#a87a1f; --fat:#66762a; --warn:#a2541b;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111512; --surface:#1a201c; --ink:#e6ebe5; --muted:#9aa79e; --line:#2b342e; --accent:#72c197; --accent-ink:#0f1a14; --soft:#1f2a23;
    --prot:#e48068; --carb:#dcb25c; --fat:#b6c65e; --warn:#e39a5c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1a201c; --ink:#e6ebe5; --muted:#9aa79e; --line:#2b342e; --accent:#72c197; --accent-ink:#0f1a14; --soft:#1f2a23;
  --prot:#e48068; --carb:#dcb25c; --fat:#b6c65e; --warn:#e39a5c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 60px calc(16px + env(safe-area-inset-left))}
header.top{display:flex;flex-direction:column;gap:4px;padding:8px 0 12px}
h1{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0;text-wrap:balance}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0}
nav.tabs{display:flex;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on,button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.tgt .kcal{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tgt .kcal small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.p{color:var(--prot)} .chip.g{color:var(--carb)} .chip.l{color:var(--fat)}
.chip.train{background:var(--accent);color:var(--accent-ink)}
.chip.rest{background:transparent;border:1px solid var(--line);color:var(--muted)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav .lbl{flex:1;text-align:center;font-weight:600}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.day>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
details.day>summary::-webkit-details-marker{display:none}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dname{font-family:var(--display);font-size:17px;text-transform:capitalize}
.dmeals{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.dmeals .k{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.more{color:var(--accent);font-size:13px;font-weight:600}
details[open] .more{display:none}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.meal{border-top:1px solid var(--line);padding-top:12px}
.meal .mk{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.meal .how{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:5px 4px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.na{color:var(--muted)}
tr.tot td{font-weight:600;border-bottom:none;font-size:13px;color:var(--muted)}
.daytot{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.daytot .card{padding:10px 12px;background:var(--soft);border:none}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.days7{display:flex;gap:5px;flex-wrap:wrap}
.days7 button{width:38px;padding:7px 0}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.warn{color:var(--warn);font-weight:600;font-size:13.5px}
.shop h3{font-family:var(--display);font-size:16px;margin-bottom:6px}
.shop ul{list-style:none;margin:0;padding:0}
.shop li .q{text-align:right}
.shop li label .note{display:block}
ul.plain{margin:0;padding-left:18px}
.shop li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.shop li label{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:15px}
.shop li input{width:auto}
.shop li.done span.q,.shop li.done label{opacity:.45;text-decoration:line-through}
textarea{position:absolute;left:-9999px}
@media (max-width:700px){
  .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:none;border-top:1px solid var(--line);background:var(--surface);padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
  nav.tabs button{padding:11px 6px;border:none}
  nav.tabs button:not(.on){background:transparent;color:var(--muted)}
  button{min-height:40px}
  input,select{font-size:16px}
}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
@media (max-width:420px){.form{grid-template-columns:1fr}.dmeals{grid-template-columns:1fr}.dmeals .k{padding-top:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Calculs ---------- */
function targets(p){
 const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==="H"?5:-161);
 const tdee=bmr*ACT[p.act][1];
 const g=GOALS[p.goal];
 const kcal=Math.round(tdee*(1+g[1]));
 const P=Math.round(p.w*g[2]);
 let L=Math.round(p.w*(p.sex==="H"?0.9:1.0));
 L=Math.max(L,Math.round(kcal*0.22/9));
 const G=Math.max(0,Math.round((kcal-4*P-9*L)/4));
 return {kcal,P,L,G,tdee:Math.round(tdee)};
}
function dayTarget(p,isTrain){
 const t=targets(p);
 const G=isTrain?t.G:Math.round(t.G*0.85);
 return {P:t.P,L:t.L,G,kcal:Math.round(4*t.P+9*t.L+4*G)};
}
function shares(snack){return snack?{bkf:.25,lunch:.32,snack:.13,dinner:.30}:{bkf:.28,lunch:.37,snack:0,dinner:.35}}
function macrosOf(items){let p=0,l=0,g=0;for(const k in items){const f=F[k],q=items[k]/100;p+=f.p*q;l+=f.l*q;g+=f.g*q}return {p,l,g,kcal:4*p+9*l+4*g}}
function roundItem(k,g){
 const f=F[k];
 if(f.pc){const st=f.step||1;let u=Math.round(g/f.pc/st)*st;return u*f.pc}
 const st=g>200?10:5;return Math.round(g/st)*st;
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function portion(rec,T,s){
 const items={};
 for(const k in rec.fx){let g=rec.fx[k]*s;let r=roundItem(k,g);if(F[k].pc&&r<F[k].pc*(F[k].step||1))r=F[k].pc*(F[k].step||1);if(r>0)items[k]=(items[k]||0)+r}
 const base=macrosOf(items);
 const P=F[rec.prot],C=rec.carb?F[rec.carb]:null,Fa=rec.fat?F[rec.fat]:null;
 let xp=0,xc=0,xf=0;
 const minP=P.min!=null?P.min:(P.pc?P.pc:30);
 for(let i=0;i<8;i++){
  if(C)xc=clamp((T.g-base.g-xp*P.g/100-xf*(Fa?Fa.g:0)/100)/(C.g/100),0,C.max||400);
  xp=clamp((T.p-base.p-xc*(C?C.p:0)/100-xf*(Fa?Fa.p:0)/100)/(P.p/100),minP,P.max||300);
  if(Fa)xf=clamp((T.l-base.l-xp*P.l/100-xc*(C?C.l:0)/100)/(Fa.l/100),0,Fa.max||30);
 }
 const add=(k,g)=>{let r=roundItem(k,g);if(k===rec.prot&&F[k].pc&&r<F[k].pc)r=F[k].pc;if(r>0)items[k]=(items[k]||0)+r};
 add(rec.prot,xp);if(C)add(rec.carb,xc);if(Fa)add(rec.fat,xf);
 return items;
}
function mealFor(p,rec,key,isTrain,date){
 const sh=shares(p.snack)[key];if(!sh)return null;
 if(key==="lunch"&&date&&eatsOut(p,date))return null;
 const t=dayTarget(p,isTrain);
 const T={p:t.P*sh,l:t.L*sh,g:t.G*sh};
 const s=clamp(t.kcal/2800,0.65,1.15);
 return portion(rec,T,s);
}

/* ---------- Génération du mois ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function recFor(p,day,k,di){
 const r=day[k];if(!p.sweet||!r.sale||(k!=="bkf"&&k!=="snack"))return r;
 const pool=(k==="bkf"?BKF:SNK).filter(x=>!x.sale&&allowed(x));const list=pool.length?pool:(k==="bkf"?BKF:SNK).filter(x=>!x.sale);
 return list[(di||0)%list.length];
}
function fams(rec){const s=new Set();[rec.prot,rec.carb,rec.fat,...Object.keys(rec.fx)].forEach(k=>{if(k&&F[k].fam)s.add(F[k].fam)});return s}
function allowed(rec){const f=fams(rec);return !S.excl.some(e=>f.has(e))}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let PLAN=null,PLANWARN="";
function buildPlan(){
 const r=rng(S.seed);
 let mains=MAINS.filter(allowed),bk=BKF.filter(allowed),sn=SNK.filter(allowed);
 PLANWARN="";
 if(mains.length<6){PLANWARN="Avec ces exclusions il reste trop peu de plats : certaines recettes exclues sont réutilisées.";mains=MAINS.slice()}
 if(!bk.length)bk=BKF.slice();if(!sn.length)sn=SNK.slice();
 let deck=shuffle(mains,r);const recent=[];
 const pick=(avoidFam)=>{
  const ok=x=>!recent.includes(x)&&F[x.prot].fam!==avoidFam;
  let i=deck.findIndex(ok);
  if(i<0){deck=deck.concat(shuffle(mains,r));i=deck.findIndex(ok);if(i<0)i=0}
  const x=deck.splice(i,1)[0];recent.push(x);if(recent.length>Math.min(10,mains.length-2))recent.shift();
  if(!deck.length)deck=shuffle(mains,r);return x;
 };
 const plan=[];let pb=null,ps=null;
 const d0=new Date(S.start+"T12:00:00");
 for(let i=0;i<S.days;i++){
  const d=new Date(d0);d.setDate(d0.getDate()+i);
  const lunch=pick(null),dinner=pick(F[lunch.prot].fam);
  let b;do{b=bk[Math.floor(r()*bk.length)]}while(bk.length>1&&b===pb);pb=b;
  let s;do{s=sn[Math.floor(r()*sn.length)]}while(sn.length>1&&s===ps);ps=s;
  plan.push({date:d,bkf:b,lunch,snack:s,dinner});
 }
 PLAN=plan;
}

/* ---------- Stock ---------- */
function stockOf(){if(!S.stock)S.stock={};if(!S.done)S.done={};if(!S.ledger)S.ledger={};return S.stock}
function firstOpenWeek(){for(let w=0;w<nWeeks();w++)if(!S.done[w])return w;return nWeeks()}
function projectedStock(w){
 const st=Object.assign({},stockOf());
 for(let i=firstOpenWeek();i<w;i++){if(S.done[i])continue;const t=shoppingFor(i).tot;for(const k in st)st[k]=Math.max(0,st[k]-(t[k]||0))}

 if(S.done[w]){
  const L=S.ledger[w]||{};const items=Object.keys(L.bought||{}).filter(k=>L.bought[k]>0);
  return `<div class="stack"><h2>Liste de courses</h2>${weekNav()}<div class="card stack"><h3>Courses faites pour cette semaine</h3><p class="note" style="margin:0">Ce que tu as acheté a été ajouté au stock, et ce que vous mangez cette semaine en a été retiré.</p><ul class="plain">${items.map(k=>`<li>${esc(F[k].n)} : ${stockQty(k,L.bought[k])}</li>`).join("")||"<li>Rien acheté, tout venait du stock.</li>"}</ul>${w===lastDone()?`<div class="row"><button data-act="undo">Annuler la validation</button></div>`:""}</div></div>`;
 }
 if(S.editBuy===w){
  const keys=Object.keys(tot).sort((a,b)=>F[a].n.localeCompare(F[b].n));
  return `<div class="stack"><h2>Ce que tu as acheté</h2>${weekNav()}<p class="note">Corrige les quantités avec ce que tu as vraiment pris, paquets entiers compris. Le surplus part dans le stock pour les semaines suivantes.</p><div class="card shop"><ul>${keys.map(k=>`<li><label for="bq-${k}" style="flex:1">${esc(F[k].n)}<span class="note" style="font-weight:400">besoin ${shopQty(k,tot[k])}${have[k]>0.5?`, en stock ${stockQty(k,have[k])}`:""}</span></label><span class="row" style="gap:6px;flex-wrap:nowrap"><input id="bq-${k}" data-bq="${k}" type="number" inputmode="decimal" min="0" step="any" style="width:90px" value="${toInput(k,buy[k]||0)}"><span class="note" style="width:52px">${unitLbl(k)}</span></span></li>`).join("")}</ul></div><div class="row"><button class="primary" data-act="validate">Valider et mettre à jour le stock</button><button class="ghost" data-act="cancelbuy">Annuler</button></div></div>`;
 }
 const buyKeys=Object.keys(buy),stockKeys=Object.keys(tot).filter(k=>!buy[k]);
 const html=order.map(o=>{const ks=(groups[o]||[]).filter(k=>buy[k]);if(!ks.length)return"";return `<div class="card shop"><h3>${o}</h3><ul>${ks.sort((a,b)=>F[a].n.localeCompare(F[b].n)).map(k=>`<li class="${ck[k]?"done":""}"><label><input type="checkbox" id="ck-${k}" data-ck="${k}" ${ck[k]?"checked":""}>${esc(F[k].n)}</label><span class="q">${shopQty(k,buy[k])} <span class="note">· ${euro(price(k,buy[k]))}</span>${have[k]>0.5?`<br><span class="note">${stockQty(k,have[k])} déjà en stock</span>`:""}</span></li>`).join("")}</ul></div>`}).join("");
 const fromStock=stockKeys.length?`<div class="card shop"><h3>Déjà dans le stock</h3><ul>${stockKeys.map(k=>`<li><span>${esc(F[k].n)}</span><span class="q note">${shopQty(k,tot[k])}</span></li>`).join("")}</ul></div>`:"";
 const canValidate=w===open;
 return `<div class="stack"><div class="row between"><h2>Liste de courses</h2><button data-act="copy" id="copybtn">Copier la liste</button></div>${weekNav()}<div class="card tgt"><div class="row between"><h3>Budget estimé</h3><button data-act="cheap" class="${S.cheap?"on":""}" aria-pressed="${!!S.cheap}">${S.cheap?"Prix bas activés":"Prix bas (viande surgelée, gros paquets)"}</button></div><div class="kcal">≈ ${Math.round(total)} € <small>à acheter cette semaine</small></div><p class="note" style="margin:4px 0 0">Stock déduit. Prix moyens en marque distributeur, pour les quantités exactes : en caisse, compte un peu plus à cause des paquets entiers.</p></div>
 ${canValidate?`<div class="row"><button class="primary" data-act="bought">J'ai fait les courses</button></div>`:`<p class="note">${w<open?"":"Valide d'abord les courses des semaines précédentes pour que le stock soit à jour."}</p>`}
 <p class="note">Pour vous deux, toute la semaine. Épices, sel, citron et vinaigrette non comptés.</p>${html||`<p class="warn">Tout est déjà dans le stock cette semaine.</p>`}${fromStock}<textarea id="clip" aria-hidden="true" tabindex="-1"></textarea></div>`;
}
function lastDone(){let l=-1;for(let w=0;w<nWeeks();w++)if(S.done[w])l=w;return l}
function viewStock(){
 const st=stockOf();const keys=Object.keys(st).filter(k=>st[k]>0.5).sort((a,b)=>F[a].n.localeCompare(F[b].n));
 const opts=Object.keys(F).sort((a,b)=>F[a].n.localeCompare(F[b].n)).map(k=>`<option value="${k}">${esc(F[k].n)}</option>`).join("");
 return `<div class="stack"><h2>Stock à la maison</h2><p class="note">Ce qui reste après les courses validées, plus ce que tu ajoutes à la main (placards, congélateur). C'est déduit automatiquement des listes suivantes.</p>
 <div class="card shop">${keys.length?`<ul>${keys.map(k=>`<li><label for="st-${k}" style="flex:1">${esc(F[k].n)}</label><span class="row" style="gap:6px;flex-wrap:nowrap"><input id="st-${k}" data-st="${k}" type="number" inputmode="decimal" min="0" step="any" style="width:90px" value="${F[k].pc?Math.round(st[k]/F[k].pc*10)/10:Math.round(st[k])}"><span class="note" style="width:52px">${unitLbl(k)}</span></span></li>`).join("")}</ul>`:`<p class="note" style="margin:0">Le stock est vide.</p>`}</div>
 <div class="card stack"><h3>Ajouter au stock</h3><div class="form"><label class="full" for="addk">Aliment<select id="addk">${opts}</select></label><label for="addq">Quantité<input id="addq" type="number" inputmode="decimal" min="0" step="any" placeholder="ex. 500"></label><label>&nbsp;<button data-act="addstock">Ajouter</button></label></div><p class="note" style="margin:0">En grammes, en ml pour le lait, en nombre pour les œufs, bananes, pommes, tortillas et pains burger. Mets 0 pour retirer un aliment.</p></div>
 <p class="note">Viande ou poisson frais en trop : congèle-les le jour des courses pour qu'ils tiennent jusqu'à la semaine suivante.</p>
 ${keys.length?`<div class="row"><button class="ghost" data-act="clearstock">Vider le stock</button></div>`:""}</div>`;
}
function personForm(p,i){
 return `<div class="card stack"><h2>${esc(p.name)}</h2><div class="form">
 <label class="full" for="name-${i}">Prénom<input id="name-${i}" data-p="${i}" data-f="name" value="${esc(p.name)}"></label>
 <label for="sex-${i}">Sexe<select id="sex-${i}" data-p="${i}" data-f="sex"><option value="H"${p.sex==="H"?" selected":""}>Homme</option><option value="F"${p.sex==="F"?" selected":""}>Femme</option></select></label>
 <label for="age-${i}">Âge<input id="age-${i}" type="number" inputmode="numeric" min="14" max="90" data-p="${i}" data-f="age" value="${p.age}"></label>
 <label for="h-${i}">Taille (cm)<input id="h-${i}" type="number" inputmode="numeric" min="130" max="220" data-p="${i}" data-f="h" value="${p.h}"></label>
 <label for="w-${i}">Poids (kg)<input id="w-${i}" type="number" inputmode="decimal" min="35" max="200" step="0.5" data-p="${i}" data-f="w" value="${p.w}"></label>
 <label class="full" for="act-${i}">Activité<select id="act-${i}" data-p="${i}" data-f="act">${ACT.map((a,j)=>`<option value="${j}"${p.act===j?" selected":""}>${a[0]}</option>`).join("")}</select></label>
 <label class="full" for="goal-${i}">Objectif<select id="goal-${i}" data-p="${i}" data-f="goal">${Object.entries(GOALS).map(([k,g])=>`<option value="${k}"${p.goal===k?" selected":""}>${g[0]}</option>`).join("")}</select></label>
 </div>
 <div><div class="note" style="margin-bottom:6px;font-weight:600">Jours de salle</div><div class="days7">${JOURS.map((j,d)=>`<button data-tr="${i}-${d}" class="${p.train[d]?"on":""}" aria-pressed="${p.train[d]}">${j}</button>`).join("")}</div></div>
 <label class="full" for="lunch-${i}">Le midi en semaine<select id="lunch-${i}" data-p="${i}" data-f="lunch">${LUNCH.map(([k,l])=>`<option value="${k}"${p.lunch===k?" selected":""}>${l}</option>`).join("")}</select></label>
 <div class="row"><button data-snack="${i}" class="${p.snack?"on":""}" aria-pressed="${p.snack}">${p.snack?"Avec collation":"Sans collation"}</button><button data-sweet="${i}" class="${p.sweet?"on":""}" aria-pressed="${p.sweet}">${p.sweet?"Petit déj sucré uniquement":"Petit déj sucré ou salé"}</button></div>
 </div>`;
}
function viewProfils(){
 return `<div class="stack">${targetCards()}${S.people.map(personForm).join("")}
 <div class="card stack"><h2>Le mois</h2><div class="form">
 <label for="start">Premier jour<input id="start" type="date" data-g="start" value="${S.start}"></label>
 <label for="days">Durée<select id="days" data-g="days">${[7,14,28,30,31].map(n=>`<option value="${n}"${S.days===n?" selected":""}>${n} jours</option>`).join("")}</select></label></div>
 <div><div class="note" style="margin-bottom:6px;font-weight:600">À éviter</div><div class="toggles">${EXCL.map(([k,l])=>`<button data-ex="${k}" class="${S.excl.includes(k)?"on":""}" aria-pressed="${S.excl.includes(k)}">${l}</button>`).join("")}</div></div>
 <p class="note">Les profils restent enregistrés dans ce navigateur seulement.</p>
 <div class="row"><button data-act="reset" class="ghost">Remettre les valeurs de départ</button></div></div></div>`;
}
function render(){
 if(S.week>=nWeeks())S.week=nWeeks()-1;
 document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
 $("#app").innerHTML=S.tab==="menus"?viewMenus():S.tab==="courses"?viewCourses():S.tab==="stock"?viewStock():viewProfils();
}
function refresh(full){if(full)buildPlan();save();render()}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tab){S.tab=b.dataset.tab;save();render();window.scrollTo(0,0);return}
 const a=b.dataset.act;
 if(a==="wprev"){S.week=Math.max(0,S.week-1);refresh()}
 else if(a==="wnext"){S.week=Math.min(nWeeks()-1,S.week+1);refresh()}
 else if(a==="regen"){S.seed=Math.floor(Math.random()*1e9);S.checked={};refresh(true)}
 else if(a==="reset"){const keep=S.tab;S=JSON.parse(JSON.stringify(DEFAULT));S.tab=keep;refresh(true)}
 else if(a==="copy"){
  const {buy,groups,order}=toBuy(S.week);
  const txt="Courses semaine "+(S.week+1)+"\n\n"+order.map(o=>{const ks=(groups[o]||[]).filter(k=>buy[k]);return ks.length?o+"\n"+ks.map(k=>"  "+F[k].n+" : "+shopQty(k,buy[k])).join("\n"):""}).filter(Boolean).join("\n\n");
  const done=()=>{b.textContent="Liste copiée";setTimeout(()=>{b.textContent="Copier la liste"},1800)};
  try{navigator.clipboard.writeText(txt).then(done,()=>{fallback(txt);done()})}catch(err){fallback(txt);done()}
 }
 else if(b.dataset.tr){const [i,d]=b.dataset.tr.split("-").map(Number);S.people[i].train[d]=!S.people[i].train[d];refresh()}
 else if(a==="bought"){S.editBuy=S.week;render();window.scrollTo(0,0)}
 else if(a==="cancelbuy"){S.editBuy=null;render()}
 else if(a==="validate"){
  const w=S.week,st=stockOf(),{tot}=shoppingFor(w),bought={};
  document.querySelectorAll("[data-bq]").forEach(i=>{bought[i.dataset.bq]=fromInput(i.dataset.bq,i.value)});
  S.ledger[w]={before:Object.assign({},st),bought};
  const keys=new Set([...Object.keys(st),...Object.keys(tot),...Object.keys(bought)]);
  keys.forEach(k=>{const v=Math.max(0,(st[k]||0)+(bought[k]||0)-(tot[k]||0));if(v>0.5)st[k]=v;else delete st[k]});
  S.done[w]=true;S.editBuy=null;S.checked["w"+w]={};if(S.week<nWeeks()-1)S.week++;refresh();window.scrollTo(0,0)
 }
 else if(a==="undo"){const w=S.week;if(S.ledger[w]){S.stock=S.ledger[w].before;delete S.ledger[w]}delete S.done[w];refresh()}
 else if(a==="addstock"){const k=$("#addk").value,q=fromInput(k,$("#addq").value);const st=stockOf();if(q>0)st[k]=(st[k]||0)+q;refresh()}
 else if(a==="clearstock"){S.stock={};refresh()}
 else if(a==="cheap"){S.cheap=!S.cheap;refresh()}
 else if(b.dataset.sweet){const i=+b.dataset.sweet;S.people[i].sweet=!S.people[i].sweet;refresh()}
 else if(b.dataset.snack){const i=+b.dataset.snack;S.people[i].snack=!S.people[i].snack;refresh()}
 else if(b.dataset.ex){const k=b.dataset.ex;S.excl=S.excl.includes(k)?S.excl.filter(x=>x!==k):S.excl.concat(k);refresh(true)}
});
function fallback(t){const ta=$("#clip");if(!ta)return;ta.value=t;ta.select();try{document.execCommand("copy")}catch(e){}}
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.st){const k=t.dataset.st,v=fromInput(k,t.value),st=stockOf();if(v>0.5)st[k]=v;else delete st[k];refresh();return}
 if(t.dataset.ck){const w="w"+S.week;S.checked[w]=S.checked[w]||{};S.checked[w][t.dataset.ck]=t.checked;save();t.closest("li").classList.toggle("done",t.checked);return}
 if(t.dataset.p!==undefined){const p=S.people[+t.dataset.p],f=t.dataset.f;let v=t.value;
  if(["age","h","w","act"].includes(f)){v=parseFloat(v);if(isNaN(v))return}
  if(f==="name"&&!v.trim())v="Personne "+(+t.dataset.p+1);
  p[f]=v;refresh();return}
 if(t.dataset.g){if(t.dataset.g==="start"){if(!t.value)return;S.start=t.value}else S.days=+t.value;S.week=0;refresh(true)}
});
buildPlan();render();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
